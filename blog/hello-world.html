<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新家与博客模版说明 — Wangyuxuan Zhai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/blog-post.css">
</head>

<body>

  <button type="button" class="theme-toggle" data-theme-toggle aria-label="切换为夜间模式" title="日间 / 夜间">
    <ion-icon name="sunny-outline" class="theme-icon theme-icon-show-when-dark"></ion-icon>
    <ion-icon name="moon-outline" class="theme-icon theme-icon-show-when-light"></ion-icon>
  </button>

  <div class="blog-post-shell">

    <a class="blog-post-back" href="../index.html#blog">
      <ion-icon name="arrow-back-outline"></ion-icon>
      返回 Blog
    </a>

    <article class="blog-post-frame">

      <div class="blog-post-frame-inner">

        <div class="blog-post-meta">
          <span>建站</span>
          <span class="dot-meta"></span>
          <time datetime="2026-05-12">May 12, 2026</time>
        </div>

        <h1 class="h2 article-title blog-post-title">新家与博客模版说明</h1>

        <div class="blog-post-body">
          <p>这是改版后第一篇示例文章。首页 Blog 列表里的卡片会链到本页；你可以按同样方式增加更多独立页面。</p>
          <p><strong>写新文章：</strong>复制 <code>blog/template.html</code>，改标题与正文保存为新的 <code>*.html</code>，再在 <code>index.html</code> 里 Blog 区块增加列表项指向该文件即可。</p>
          <p>顶部的「返回 Blog」会回到首页并停在 Blog 一栏（依赖地址里的 <strong>#blog</strong>）。Others 等与 Blog 互不干扰。</p>
        </div>

      </div>

    </article>

  </div>

  <script src="../assets/js/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
